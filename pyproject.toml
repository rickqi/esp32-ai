[project]
name = "esp32-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "requests>=2.34.2",
    "tokenizers>=0.23.1",
    "torch>=2.11.0",
    "tqdm>=4.69.0",
]

[tool.uv.sources]
# RTX 5080 (Blackwell sm_120) requires CUDA 12.8+ builds; keep torch on cu128.
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
